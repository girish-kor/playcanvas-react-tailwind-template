name: Bug report
description: Something in the template isn't working as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm run dev
        2. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: playcanvas / @playcanvas/react version
      placeholder: e.g. playcanvas@2.1.0, @playcanvas/react@0.5.0
    validations:
      required: false

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      multiple: true
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Console output / stack trace
      render: shell
    validations:
      required: false
